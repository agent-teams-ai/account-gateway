schemaVersion: 2
workspace: {kind: pnpm, manifest: pnpm-workspace.yaml}
packageRoots: [packages, services]
governedRoots: [packages/account-gateway/src, services/account-gateway/src, services/account-gateway/test]
boundaries:
  - id: facade-contracts
    dependencyMode: runtime
    roots: [packages/account-gateway/src/features/facade-client/contracts]
    entrypoints: [packages/account-gateway/src/features/facade-client/contracts/index.ts]
    allow: {boundaries: [], packages: [zod], builtins: [], runtimeReferences: []}
  - id: facade-http
    dependencyMode: runtime
    roots: [packages/account-gateway/src/features/facade-client/http]
    entrypoints: [packages/account-gateway/src/features/facade-client/http/index.ts]
    allow: {boundaries: [facade-contracts], packages: [zod], builtins: [], runtimeReferences: []}
  - id: contracts
    dependencyMode: runtime
    roots: [packages/account-gateway/src/contracts]
    entrypoints: [packages/account-gateway/src/contracts/index.ts]
    packageExports: [./contracts]
    allow: {boundaries: [facade-contracts], packages: [], builtins: [], runtimeReferences: []}
  - id: http
    dependencyMode: runtime
    roots: [packages/account-gateway/src/http]
    entrypoints: [packages/account-gateway/src/http/index.ts]
    packageExports: [./http]
    allow: {boundaries: [facade-http], packages: [], builtins: [], runtimeReferences: []}
  - id: get-modular
    dependencyMode: runtime
    roots: [packages/account-gateway/src/get-modular]
    entrypoints: [packages/account-gateway/src/get-modular/index.ts]
    packageExports: [./get-modular]
    allow: {boundaries: [http], packages: ['@get-modular/core', '@get-modular/assembly'], builtins: [], runtimeReferences: []}
  - id: kernel-domain
    dependencyMode: runtime
    roots: [services/account-gateway/src/domain.ts]
    entrypoints: [services/account-gateway/src/domain.ts]
    allow: {boundaries: [], packages: [], builtins: [], runtimeReferences: []}
  - id: kernel-postgres
    dependencyMode: runtime
    roots: [services/account-gateway/src/postgres.ts]
    entrypoints: [services/account-gateway/src/postgres.ts]
    allow: {boundaries: [kernel-domain], packages: [pg], builtins: ['node:crypto'], runtimeReferences: []}
  - id: kernel-composition
    dependencyMode: runtime
    roots: [services/account-gateway/src/composition.ts]
    entrypoints: [services/account-gateway/src/composition.ts]
    allow: {boundaries: [kernel-domain, kernel-postgres], packages: [pg], builtins: [], runtimeReferences: []}
  - id: kernel-tests
    dependencyMode: runtime
    roots: [services/account-gateway/test]
    entrypoints: [services/account-gateway/test/domain.test.ts, services/account-gateway/test/postgres.test.ts]
    allow: {boundaries: [kernel-domain, kernel-postgres], packages: [pg], builtins: ['node:test', 'node:assert/strict', 'node:crypto', 'node:fs/promises', 'node:timers/promises'], runtimeReferences: []}
