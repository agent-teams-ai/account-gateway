    entrypoints: [packages/account-gateway/src/features/facade-client/http/index.ts]
    allow: {boundaries: [facade-contracts], packages: [zod], builtins: [], runtimeReferences: []}
  - id: contracts
    dependencyMode: runtime
    roots: [packages/account-gateway/src/contracts]
    entrypoints: [packages/account-gateway/src/contracts/index.ts]
    packageExports: [./contracts]
    allow: {boundaries: [facade-contracts], packages: [], builtins: [], runtimeReferences: []}
  - id: http
    dependencyMode: runtime
    roots: [packages/account-gateway/src/http]
    entrypoints: [packages/account-gateway/src/http/index.ts]
