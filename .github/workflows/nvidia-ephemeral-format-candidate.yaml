name: NVIDIA ephemeral formatting evidence
on:
  push:
    branches:
      - feat/nvidia-build-sandbox-profile
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "26.11.1"
      - run: npm install --prefix "$RUNNER_TEMP/gateway-pnpm" --ignore-scripts pnpm@11.28.2
      - run: node "$RUNNER_TEMP/gateway-pnpm/node_modules/pnpm/bin/pnpm.cjs" --config.engine-strict=true install --frozen-lockfile
      - name: Print exact source-only formatter diff (read-only evidence)
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/format-tools" --ignore-scripts --no-audit oxfmt@0.74.0
          "$RUNNER_TEMP/format-tools/node_modules/.bin/oxfmt" --write services/account-gateway/src/provider-connection-capabilities.ts services/account-gateway/src/service-config.ts tests/account-models.test.mts tests/provider-connections-sdk.test.mts
          echo BEGIN_NVIDIA_FORMAT_DIFF
          git --no-pager diff -- services/account-gateway/src/provider-connection-capabilities.ts services/account-gateway/src/service-config.ts tests/account-models.test.mts tests/provider-connections-sdk.test.mts
          echo END_NVIDIA_FORMAT_DIFF
      - name: Build pinned candidate SDK
        shell: bash
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/gateway-pnpm/node_modules/pnpm/bin/pnpm.cjs" run build
          mkdir -p "$RUNNER_TEMP/nvidia-sdk"
          node "$RUNNER_TEMP/gateway-pnpm/node_modules/pnpm/bin/pnpm.cjs" --dir packages/account-gateway pack --pack-destination "$RUNNER_TEMP/nvidia-sdk"
          ls -l "$RUNNER_TEMP/nvidia-sdk"
      - name: Export candidate SDK archive (not released)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nvidia-account-gateway-candidate-sdk
          path: ${{ runner.temp }}/nvidia-sdk/*.tgz
          retention-days: 3
          if-no-files-found: error

  native-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: agent-teams-ai/sub2api
          ref: e648cf939a77636f7f571fd10dd51a01d7f0a17c
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
          cache-dependency-path: backend/go.sum
      - name: Print exact Sub2API gofmt diff
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w backend/internal/gatewaybootstrap/config.go backend/internal/gatewaybootstrap/server_linux.go backend/internal/gatewaytransport/registry.go backend/internal/gatewaytransport/wire.go backend/internal/handler/admin/native_gateway_identity.go backend/internal/service/native_gateway_account_models.go backend/internal/service/native_gateway_identity.go backend/internal/service/native_gateway_provider_responses.go backend/internal/service/native_gateway_provider_responses_test.go backend/internal/service/native_gateway_responses.go backend/internal/service/native_gateway_nvidia_profile_test.go
          echo BEGIN_NVIDIA_NATIVE_FORMAT_DIFF
          git --no-pager diff -- backend/internal/gatewaybootstrap/config.go backend/internal/gatewaybootstrap/server_linux.go backend/internal/gatewaytransport/registry.go backend/internal/gatewaytransport/wire.go backend/internal/handler/admin/native_gateway_identity.go backend/internal/service/native_gateway_account_models.go backend/internal/service/native_gateway_identity.go backend/internal/service/native_gateway_provider_responses.go backend/internal/service/native_gateway_provider_responses_test.go backend/internal/service/native_gateway_responses.go backend/internal/service/native_gateway_nvidia_profile_test.go
          echo END_NVIDIA_NATIVE_FORMAT_DIFF
      - name: Source-pinned Sub2API unit and protected-contract tests
        working-directory: backend
        run: |
          set -euo pipefail
          go test -tags unit ./internal/service ./internal/gatewaytransport ./internal/handler/admin ./internal/gatewaybootstrap -run 'TestGatewayNVIDIABuild|TestGatewayProviderResponses' -count=1
          go test -tags unit ./internal/service ./internal/gatewaytransport -run '^TestGatewayNative' -count=1
