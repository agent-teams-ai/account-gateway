name: NVIDIA ephemeral formatting evidence
on:
  push:
    branches:
      - feat/nvidia-build-sandbox-profile
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "26.11.1"
      - run: npm install --prefix "$RUNNER_TEMP/gateway-pnpm" --ignore-scripts pnpm@11.28.2
      - run: node "$RUNNER_TEMP/gateway-pnpm/node_modules/pnpm/bin/pnpm.cjs" --config.engine-strict=true install --frozen-lockfile
      - name: Print exact source-only formatter diff (read-only evidence)
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/format-tools" --ignore-scripts --no-audit oxfmt@0.74.0
          "$RUNNER_TEMP/format-tools/node_modules/.bin/oxfmt" --write services/account-gateway/src/provider-connection-capabilities.ts services/account-gateway/src/service-config.ts tests/account-models.test.mts tests/provider-connections-sdk.test.mts
          echo BEGIN_NVIDIA_FORMAT_DIFF
          git --no-pager diff -- services/account-gateway/src/provider-connection-capabilities.ts services/account-gateway/src/service-config.ts tests/account-models.test.mts tests/provider-connections-sdk.test.mts
          echo END_NVIDIA_FORMAT_DIFF
      - name: Build pinned candidate SDK
        shell: bash
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/gateway-pnpm/node_modules/pnpm/bin/pnpm.cjs" run build
          mkdir -p "$RUNNER_TEMP/nvidia-sdk"
          node "$RUNNER_TEMP/gateway-pnpm/node_modules/pnpm/bin/pnpm.cjs" --dir packages/account-gateway pack --pack-destination "$RUNNER_TEMP/nvidia-sdk"
          ls -l "$RUNNER_TEMP/nvidia-sdk"
      - name: Export candidate SDK archive (not released)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nvidia-account-gateway-candidate-sdk
          path: ${{ runner.temp }}/nvidia-sdk/*.tgz
          retention-days: 3
          if-no-files-found: error

  native-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.10@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
        env:
          POSTGRES_USER: native_contract_test
          POSTGRES_DB: native_review_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U native_contract_test -d native_review_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis_http:
        image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
        ports:
          - 127.0.0.1:6380:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: agent-teams-ai/sub2api
          ref: a958717d3ad137cfbad21784923d3eff31a00651
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
          cache-dependency-path: backend/go.sum
      - name: Print exact Sub2API gofmt diff
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w backend/internal/gatewaybootstrap/config.go backend/internal/gatewaybootstrap/server_linux.go backend/internal/gatewaytransport/registry.go backend/internal/gatewaytransport/wire.go backend/internal/handler/admin/native_gateway_identity.go backend/internal/service/native_gateway_account_models.go backend/internal/service/native_gateway_identity.go backend/internal/service/native_gateway_provider_responses.go backend/internal/service/native_gateway_provider_responses_test.go backend/internal/service/native_gateway_responses.go backend/internal/service/native_gateway_nvidia_profile_test.go backend/internal/handler/admin/native_gateway_review_integration_test.go backend/internal/service/native_gateway_nvidia_chat_integration_test.go
          echo BEGIN_NVIDIA_NATIVE_FORMAT_DIFF
          git --no-pager diff -- backend/internal/gatewaybootstrap/config.go backend/internal/gatewaybootstrap/server_linux.go backend/internal/gatewaytransport/registry.go backend/internal/gatewaytransport/wire.go backend/internal/handler/admin/native_gateway_identity.go backend/internal/service/native_gateway_account_models.go backend/internal/service/native_gateway_identity.go backend/internal/service/native_gateway_provider_responses.go backend/internal/service/native_gateway_provider_responses_test.go backend/internal/service/native_gateway_responses.go backend/internal/service/native_gateway_nvidia_profile_test.go backend/internal/handler/admin/native_gateway_review_integration_test.go backend/internal/service/native_gateway_nvidia_chat_integration_test.go
          echo END_NVIDIA_NATIVE_FORMAT_DIFF
      - name: Source-pinned Sub2API unit and protected-contract tests
        working-directory: backend
        run: |
          set -euo pipefail
          go test -tags unit ./internal/service ./internal/gatewaytransport ./internal/handler/admin ./internal/gatewaybootstrap -run 'TestGatewayNVIDIABuild|TestGatewayProviderResponses' -count=1
          go test -tags unit ./internal/service ./internal/gatewaytransport -run '^TestGatewayNative' -count=1
      - name: Real PostgreSQL native candidate and migration qualification
        working-directory: backend
        env:
          GATEWAY_NATIVE_TEST_PG_DSN: postgres://native_contract_test@127.0.0.1:5432/native_review_ci?sslmode=disable
          GATEWAY_NATIVE_TEST_HTTP_REDIS_ADDR: 127.0.0.1:6380
        shell: bash
        run: |
          set -euo pipefail
          go test -tags integration ./internal/handler/admin -run TestGatewayNativeReviewPrivateHTTPPostgres -count=1 -v -timeout 180s | tee "$RUNNER_TEMP/nvidia-native-pg.txt"
          grep -q -- '--- PASS: TestGatewayNativeReviewPrivateHTTPPostgres ' "$RUNNER_TEMP/nvidia-native-pg.txt"

