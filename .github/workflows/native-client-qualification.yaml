name: Native clients and provider stages without Review Router acceptance
on:
  push:
    branches: [test/native-provider-stage-20261119]
permissions:
  contents: read
concurrency:
  group: native-provider-stage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native_client_provider_stages:
    name: native clients and providers (Node ${{ matrix.node }}, no RR acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node: ["26.11.1", "24.21.0"]
    env:
      NPM_CONFIG_ENGINE_STRICT: "true"
      NATIVE_COMMIT: 2d28e360b51a50c9314dadb4460d55d5b64869c8
      PG_IMAGE: postgres:17.10@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
      - name: Retain the qualified Corepack entrypoint
        run: |
          corepack_entry="$(dirname "$(dirname "$(command -v node)")")/lib/node_modules/corepack/dist/corepack.js"
          test -f "$corepack_entry"
          echo "GATEWAY_CLIENT_COREPACK=$corepack_entry" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - name: Prepare exact source and pinned real clients
        run: |
          test "$(node --version)" = "v${{ matrix.node }}"
          cli_root="$RUNNER_TEMP/gateway-native-clients"
          mkdir -p "$cli_root/build" "$cli_root/container" "$cli_root/shim" "$cli_root/tmp"
          sudo mkdir -m 700 "$cli_root/artifacts"
          echo "GATEWAY_CLIENT_ROOT=$cli_root" >> "$GITHUB_ENV"
          echo "GATEWAY_CLIENT_NODE=$(command -v node)" >> "$GITHUB_ENV"
          echo "GATEWAY_CLIENT_NODE_HOME=$(dirname "$(dirname "$(command -v node)")")" >> "$GITHUB_ENV"
          echo "GATEWAY_CLIENT_GO=$(command -v go)" >> "$GITHUB_ENV"
          echo "GATEWAY_CLIENT_GO_HOME=$(go env GOROOT)" >> "$GITHUB_ENV"
          echo "GOCACHE=$cli_root/go-cache" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$cli_root/go-modules" >> "$GITHUB_ENV"
          echo "GOPATH=$cli_root/go" >> "$GITHUB_ENV"
          echo "TMPDIR=$cli_root/tmp" >> "$GITHUB_ENV"
          echo "COREPACK_HOME=$cli_root/corepack" >> "$GITHUB_ENV"
          printf '#!/bin/sh\nexec "%s" "%s" pnpm "$@"\n' "$(command -v node)" "$GATEWAY_CLIENT_COREPACK" > "$cli_root/shim/pnpm"
          chmod 755 "$cli_root/shim/pnpm"
          echo "$cli_root/shim" >> "$GITHUB_PATH"
          git clone --no-checkout https://github.com/agent-teams-ai/sub2api.git "$cli_root/native-source"
          git -C "$cli_root/native-source" checkout --detach "$NATIVE_COMMIT"
          test "$(git -C "$cli_root/native-source" rev-parse HEAD)" = "$NATIVE_COMMIT"
          test -z "$(git -C "$cli_root/native-source" status --porcelain)"
          python3 services/account-gateway/test/fixtures/native-cli/install.py --destination "$cli_root/clients"
      - name: Install frozen TypeScript dependencies and build the real SDK
        run: |
          test "$(pnpm --version)" = 11.28.2
          pnpm --config.engine-strict=true install --frozen-lockfile --store-dir "$GATEWAY_CLIENT_ROOT/store" --virtual-store-dir "$GATEWAY_CLIENT_ROOT/virtual"
          node node_modules/typescript/bin/tsc --project tsconfig.build.json --outDir "$GATEWAY_CLIENT_ROOT/sdk-dist"
          test -f "$GATEWAY_CLIENT_ROOT/sdk-dist/index.js"
          test -f "$GATEWAY_CLIENT_ROOT/sdk-dist/index.d.ts"
          ln -s "$GITHUB_WORKSPACE/packages/account-gateway/node_modules" "$GATEWAY_CLIENT_ROOT/sdk-dist/node_modules"
          ln -s "$GATEWAY_CLIENT_ROOT/sdk-dist" packages/account-gateway/dist
          pnpm --dir services/account-gateway run typecheck
          node --test services/account-gateway/test/fixtures/native-cli/joined-evidence.test.ts
          git diff --exit-code -- pnpm-lock.yaml
      - name: Build isolated real-client and PostgreSQL lifecycle test binaries
        run: |
          cd "$GATEWAY_CLIENT_ROOT/native-source/backend"
          go test -tags unit,nativecli -c ./internal/gatewaytransport -o "$GATEWAY_CLIENT_ROOT/build/native-cli.test"
          go test -c ./internal/repository -o "$GATEWAY_CLIENT_ROOT/build/native-repository.test"
          CGO_ENABLED=0 go test -tags unit -c -ldflags='-s -w' ./internal/service -o "$GATEWAY_CLIENT_ROOT/build/native-account-info-service.test"
          CGO_ENABLED=0 go test -tags gatewaycustody -c -ldflags='-s -w' ./internal/repository -o "$GATEWAY_CLIENT_ROOT/build/native-account-info-repository.test"
          CGO_ENABLED=0 go test -tags unit -c -ldflags='-s -w' ./internal/gatewaybootstrap -o "$GATEWAY_CLIENT_ROOT/build/native-account-info-bootstrap.test"
          CGO_ENABLED=0 go test -tags unit -c -ldflags='-s -w' ./internal/handler/admin -o "$GATEWAY_CLIENT_ROOT/build/native-account-info-handler.test"
          git diff --exit-code -- go.mod go.sum
          cat > "$GATEWAY_CLIENT_ROOT/container/Dockerfile" <<'DOCKERFILE'
          ARG PG_IMAGE
          FROM ${PG_IMAGE}
          RUN . /etc/os-release && test "$VERSION_CODENAME" = trixie \
            && apt-get update \
            && DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends --no-upgrade \
              libatomic1=14.2.0-19 ca-certificates=20250419+deb13u1 git=1:2.47.3-0+deb13u1 \
            && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
          docker build --pull --build-arg "PG_IMAGE=$PG_IMAGE" --tag gateway-native-clients:qualified "$GATEWAY_CLIENT_ROOT/container"
      - name: Native metadata and provider boundary unit qualification
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { goTestEvidence } from './services/account-gateway/test/fixtures/native-cli/evidence.ts';
          const suites = [
            ['service', '^TestGateway(AccountInfo|QuotaAndInfo|Codex(Info|RetainedInfo|Maintenance)|ClaudeInfo|GrokInfo|OAuthInfo|AccountCapabilities|GeminiContinuation|NativeGemini|NativeOfficial|NativeAnthropicSchema|NativeOAuthImport)', [
              'TestGatewayAccountInfoReaderUsesCurrentSnapshotAndFinalAuthority',
              'TestGatewayCodexMaintenanceHydratesOnceWithoutProviderHTTP',
              'TestGatewayNativeOfficialAnthropicOriginalSchemaBeforeSuccess',
              'TestGatewayNativeOfficialGeminiActualTLSContinuationAndSchema',
              'TestGatewayNativeOAuthImportStrictEscapedIngressAndSeparateCodec',
            ]],
            ['bootstrap', '^Test(NativeAccountCapabilities|NativeOfficialAPIConfig|GatewayAccountLimitsAuthorityHTTP)', [
              'TestNativeAccountCapabilitiesExposeImportsOnlyWithComposedCodex',
              'TestNativeOfficialAPIConfigUsesExistingClosedFD6Profiles',
              'TestGatewayAccountLimitsAuthorityHTTP',
            ]],
            ['handler', '^TestGateway(AccountInfoPrivateHTTPContract|NativeOAuthConnectHTTPImportStrictIngress)', [
              'TestGatewayAccountInfoPrivateHTTPContract',
              'TestGatewayNativeOAuthConnectHTTPImportStrictIngress',
            ]],
          ];
          for (const [suite, pattern, required] of suites) {
            const binary = join(process.env.GATEWAY_CLIENT_ROOT, 'build', 'native-account-info-' + suite + '.test');
            const options = { encoding: 'utf8', timeout: 120000, maxBuffer: 2 * 1024 * 1024 };
            const listed = spawnSync(binary, ['-test.list', pattern], options);
            assert.equal(listed.status, 0, suite + ' test listing');
            const names = listed.stdout.split(/\r?\n/).filter(name => /^Test[A-Za-z0-9_]{1,160}$/.test(name));
            assert.ok(required.every(name => names.includes(name)), suite + ' required tests must exist');
            const executed = spawnSync(binary, ['-test.run', pattern, '-test.v', '-test.count=1', '-test.timeout=110s'], options);
            const evidence = goTestEvidence(executed.stdout ?? '', names);
            writeFileSync(join(process.env.GATEWAY_CLIENT_ROOT, 'build', 'native-' + suite + '-unit.json'), JSON.stringify(evidence) + '\n');
            console.log(JSON.stringify({ suite, ...evidence }));
            assert.equal(executed.status, 0, suite + ' unit execution');
            assert.equal(evidence.tests.length, names.length, suite + ' no missing test results');
            assert.ok(names.every(name => evidence.tests.some(test => test.name === name && test.outcome === 'PASS')), suite + ' every selected test must pass without skip');
          }
          NODE
      - name: Build source-pinned fixtures with the existing builder
        run: |
          node services/account-gateway/test/fixtures/native-cli/build-joined.ts \
            --repo "$GITHUB_WORKSPACE" --native-source "$GATEWAY_CLIENT_ROOT/native-source" \
            --output "$GATEWAY_CLIENT_ROOT/build/joined" --go "$GATEWAY_CLIENT_GO" \
            --native-commit "$NATIVE_COMMIT" --gateway-commit "$(git rev-parse HEAD)"
      - name: Race-check the actual public ingress and bounded bootstrap
        run: |
          node --test services/account-gateway/test/fixtures/native-cli/evidence.test.ts
          node services/account-gateway/test/fixtures/native-cli/race.ts \
            "$GATEWAY_CLIENT_ROOT/native-source/backend" "$GATEWAY_CLIENT_ROOT/build"
      - name: Real Codex and Claude Code through Go, OAuth and PostgreSQL without egress
        run: |
          docker run --rm --network none --user 0:0 --cpus 2 --memory 4g --pids-limit 256 --ulimit nofile=4096:4096 \
            --mount "type=bind,source=$GATEWAY_CLIENT_NODE_HOME,target=$GATEWAY_CLIENT_NODE_HOME,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=$GITHUB_WORKSPACE,readonly" \
            --mount "type=bind,source=$GATEWAY_CLIENT_ROOT,target=$GATEWAY_CLIENT_ROOT,readonly" \
            --mount "type=bind,source=$GATEWAY_CLIENT_ROOT/artifacts,target=$GATEWAY_CLIENT_ROOT/artifacts" \
            --entrypoint "$GATEWAY_CLIENT_NODE" gateway-native-clients:qualified \
            "$GITHUB_WORKSPACE/services/account-gateway/test/fixtures/native-cli/run.ts" \
            --pg-bin /usr/lib/postgresql/17/bin \
            --test-binary "$GATEWAY_CLIENT_ROOT/build/native-cli.test" \
            --repository-test-binary "$GATEWAY_CLIENT_ROOT/build/native-repository.test" \
            --account-info-test-binary "$GATEWAY_CLIENT_ROOT/build/native-account-info-repository.test" \
            --clients "$GATEWAY_CLIENT_ROOT/clients/clients.json" \
            --artifacts "$GATEWAY_CLIENT_ROOT/artifacts/native-clients" \
            --native-commit "$NATIVE_COMMIT" --gateway-commit "$(git rev-parse HEAD)"
      - name: Join real Codex and Claude Code to TypeScript authority without Review Router acceptance
        run: |
          docker run --rm --network none --user 0:0 --cpus 2 --memory 4g --pids-limit 256 --ulimit nofile=4096:4096 \
            --mount "type=bind,source=$GATEWAY_CLIENT_NODE_HOME,target=$GATEWAY_CLIENT_NODE_HOME,readonly" \
            --mount "type=bind,source=$GATEWAY_CLIENT_GO_HOME,target=$GATEWAY_CLIENT_GO_HOME,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=$GITHUB_WORKSPACE,readonly" \
            --mount "type=bind,source=$GATEWAY_CLIENT_ROOT,target=$GATEWAY_CLIENT_ROOT,readonly" \
            --mount "type=bind,source=$GATEWAY_CLIENT_ROOT/build/joined/native-claude-joined,target=/tmp/native-claude-joined,readonly" \
            --mount "type=bind,source=$GATEWAY_CLIENT_ROOT/build/joined/native-device-joined,target=/tmp/native-device-joined,readonly" \
            --mount "type=bind,source=$GATEWAY_CLIENT_ROOT/artifacts,target=$GATEWAY_CLIENT_ROOT/artifacts" \
            --entrypoint "$GATEWAY_CLIENT_NODE" gateway-native-clients:qualified \
            "$GITHUB_WORKSPACE/services/account-gateway/test/fixtures/native-cli/joined.ts" \
            --repo "$GITHUB_WORKSPACE" --pg-bin /usr/lib/postgresql/17/bin --go "$GATEWAY_CLIENT_GO" \
            --claude-binary /tmp/native-claude-joined/fixture --codex-binary /tmp/native-device-joined/fixture \
            --clients "$GATEWAY_CLIENT_ROOT/clients/clients.json" \
            --build-receipt "$GATEWAY_CLIENT_ROOT/build/joined/joined-build.json" \
            --artifacts "$GATEWAY_CLIENT_ROOT/artifacts/joined-clients" \
            --native-commit "$NATIVE_COMMIT" --gateway-commit "$(git rev-parse HEAD)"
      - name: Qualify six native providers through the facade and SDK without a CLI
        run: |
          docker run --rm --network none --user 0:0 --cpus 2 --memory 4g --pids-limit 256 --ulimit nofile=4096:4096 \
            --mount "type=bind,source=$GATEWAY_CLIENT_NODE_HOME,target=$GATEWAY_CLIENT_NODE_HOME,readonly" \
            --mount "type=bind,source=$GATEWAY_CLIENT_GO_HOME,target=$GATEWAY_CLIENT_GO_HOME,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=$GITHUB_WORKSPACE,readonly" \
            --mount "type=bind,source=$GATEWAY_CLIENT_ROOT,target=$GATEWAY_CLIENT_ROOT,readonly" \
            --mount "type=bind,source=$GATEWAY_CLIENT_ROOT/build/joined/native-provider-joined,target=/tmp/native-provider-joined,readonly" \
            --mount "type=bind,source=$GATEWAY_CLIENT_ROOT/artifacts,target=$GATEWAY_CLIENT_ROOT/artifacts" \
            --entrypoint "$GATEWAY_CLIENT_NODE" gateway-native-clients:qualified \
            "$GITHUB_WORKSPACE/services/account-gateway/test/fixtures/native-cli/joined.ts" \
            --repo "$GITHUB_WORKSPACE" --pg-bin /usr/lib/postgresql/17/bin --go "$GATEWAY_CLIENT_GO" \
            --provider-binary /tmp/native-provider-joined/fixture --scope native-providers \
            --build-receipt "$GATEWAY_CLIENT_ROOT/build/joined/joined-build.json" \
            --artifacts "$GATEWAY_CLIENT_ROOT/artifacts/native-providers" \
            --native-commit "$NATIVE_COMMIT" --gateway-commit "$(git rev-parse HEAD)"
      - name: Expose bounded native client and provider evidence without Review Router acceptance
        if: ${{ always() && env.GATEWAY_CLIENT_ROOT != '' }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$GATEWAY_CLIENT_ROOT/artifacts"
          node --input-type=module -e '
            import { readFileSync, existsSync } from "node:fs";
            import { join } from "node:path";
            for (const stage of ["native-clients", "joined-clients", "native-providers"]) {
              const path = join(process.env.GATEWAY_CLIENT_ROOT, "artifacts", stage, "result.json");
              if (existsSync(path)) process.stdout.write(stage + "\n" + readFileSync(path, "utf8") + "\n");
            }
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && env.GATEWAY_CLIENT_ROOT != '' }}
        with:
          name: native-client-provider-stages-no-rr-${{ matrix.node }}
          path: |
            ${{ env.GATEWAY_CLIENT_ROOT }}/artifacts/native-clients/result.json
            ${{ env.GATEWAY_CLIENT_ROOT }}/artifacts/native-clients/network.json
            ${{ env.GATEWAY_CLIENT_ROOT }}/artifacts/native-clients/test.log
            ${{ env.GATEWAY_CLIENT_ROOT }}/artifacts/native-clients/repository-test.log
            ${{ env.GATEWAY_CLIENT_ROOT }}/artifacts/native-clients/account-info-test.log
            ${{ env.GATEWAY_CLIENT_ROOT }}/build/public-race.json
            ${{ env.GATEWAY_CLIENT_ROOT }}/build/reservation-race.json
            ${{ env.GATEWAY_CLIENT_ROOT }}/build/bootstrap-race.json
            ${{ env.GATEWAY_CLIENT_ROOT }}/build/upstream-race.json
            ${{ env.GATEWAY_CLIENT_ROOT }}/build/diagnostics-race.json
            ${{ env.GATEWAY_CLIENT_ROOT }}/build/joined/joined-build.json
            ${{ env.GATEWAY_CLIENT_ROOT }}/build/native-service-unit.json
            ${{ env.GATEWAY_CLIENT_ROOT }}/build/native-bootstrap-unit.json
            ${{ env.GATEWAY_CLIENT_ROOT }}/build/native-handler-unit.json
            ${{ env.GATEWAY_CLIENT_ROOT }}/artifacts/joined-clients/result.json
            ${{ env.GATEWAY_CLIENT_ROOT }}/artifacts/joined-clients/network.json
            ${{ env.GATEWAY_CLIENT_ROOT }}/artifacts/native-providers/result.json
            ${{ env.GATEWAY_CLIENT_ROOT }}/artifacts/native-providers/network.json
          if-no-files-found: error
          retention-days: 14
  native_partial_stage_gate:
    name: native clients and providers partial gate (no Review Router acceptance)
    needs: native_client_provider_stages
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require both partial native client and provider lanes
        env:
          LANE_RESULT: ${{ needs.native_client_provider_stages.result }}
        run: test "$LANE_RESULT" = success
