name: Pinned native client and public ingress qualification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-client-qualification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native_clients:
    name: native clients (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node: ['26.11.1', '24.21.0']
    env:
      NPM_CONFIG_ENGINE_STRICT: 'true'
      NATIVE_COMMIT: f2fa862ba6b197529309b780ae5919be6651daeb
      REVIEW_ROUTER_COMMIT: 3249410e9c6e9b0192630de89185c1e55b613a0b
      REVIEW_ACTION_COMMIT: 0454fc0a3af15f94522c7c31cce59c0c62af6567
      PG_IMAGE: postgres:17.10@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Retain the qualified Corepack entrypoint
        run: |
          corepack_entry="$(dirname "$(dirname "$(command -v node)")")/lib/node_modules/corepack/dist/corepack.js"
          test -f "$corepack_entry"
          echo "GATEWAY_CLIENT_COREPACK=$corepack_entry" >> "$GITHUB_ENV"
          echo "GATEWAY_CLIENT_RR_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Prepare exact source and pinned real clients
        run: |
          test "$(node --version)" = "v${{ matrix.node }}"
          cli_root="$RUNNER_TEMP/gateway-native-clients"
          mkdir -p "$cli_root/build" "$cli_root/container" "$cli_root/shim" "$cli_root/tmp"
          sudo mkdir -m 700 "$cli_root/artifacts"
          echo "GATEWAY_CLIENT_ROOT=$cli_root" >> "$GITHUB_ENV"
          echo "GATEWAY_CLIENT_NODE=$(command -v node)" >> "$GITHUB_ENV"
          echo "GATEWAY_CLIENT_NODE_HOME=$(dirname "$(dirname "$(command -v node)")")" >> "$GITHUB_ENV"
          echo "GATEWAY_CLIENT_GO=$(command -v go)" >> "$GITHUB_ENV"
          echo "GATEWAY_CLIENT_GO_HOME=$(go env GOROOT)" >> "$GITHUB_ENV"
          echo "GOCACHE=$cli_root/go-cache" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$cli_root/go-modules" >> "$GITHUB_ENV"
          echo "GOPATH=$cli_root/go" >> "$GITHUB_ENV"
          echo "TMPDIR=$cli_root/tmp" >> "$GITHUB_ENV"
          echo "COREPACK_HOME=$cli_root/corepack" >> "$GITHUB_ENV"
          printf '#!/bin/sh\nexec "%s" "%s" pnpm "$@"\n' "$(command -v node)" "$GATEWAY_CLIENT_COREPACK" > "$cli_root/shim/pnpm"
          chmod 755 "$cli_root/shim/pnpm"
          echo "$cli_root/shim" >> "$GITHUB_PATH"
          git clone --no-checkout https://github.com/agent-teams-ai/sub2api.git "$cli_root/native-source"
          git -C "$cli_root/native-source" checkout --detach "$NATIVE_COMMIT"
          test "$(git -C "$cli_root/native-source" rev-parse HEAD)" = "$NATIVE_COMMIT"
          test -z "$(git -C "$cli_root/native-source" status --porcelain)"
          python3 services/account-gateway/test/fixtures/native-cli/install.py --destination "$cli_root/clients"
      - name: Extract pinned AppArmor compiler and ABI without changing host packages
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, urllib.request
          root = pathlib.Path(os.environ['GATEWAY_CLIENT_ROOT'])
          tools = root / 'apparmor-tools'
          tools.mkdir(mode=0o700)
          pins = json.loads(pathlib.Path('services/account-gateway/test/fixtures/native-cli/apparmor-pins.json').read_text())
          for package in pins['packages']:
              assert re.fullmatch(r'[A-Za-z0-9_+.-]+\.deb', package['file'])
              assert re.fullmatch(r'https://snapshot\.debian\.org/file/[a-f0-9]{40}', package['url'])
              with urllib.request.urlopen(package['url'], timeout=90) as response:
                  content = response.read(2 * 1024 * 1024 + 1)
              assert len(content) <= 2 * 1024 * 1024
              assert hashlib.sha256(content).hexdigest() == package['sha256']
              archive = root / 'build' / package['file']
              archive.write_bytes(content)
              subprocess.run(['dpkg-deb', '--extract', str(archive), str(tools)], check=True, timeout=30)
          for relative, digest in pins['files'].items():
              assert hashlib.sha256((tools / relative).read_bytes()).hexdigest() == digest
          (tools / 'empty.conf').write_text('')
          PY
      - name: Install frozen TypeScript dependencies and build the real SDK
        run: |
          test "$(pnpm --version)" = 11.28.2
          pnpm --config.engine-strict=true install --frozen-lockfile --store-dir "$GATEWAY_CLIENT_ROOT/store" --virtual-store-dir "$GATEWAY_CLIENT_ROOT/virtual"
          node node_modules/typescript/bin/tsc --project tsconfig.build.json --outDir "$GATEWAY_CLIENT_ROOT/sdk-dist"
          test -f "$GATEWAY_CLIENT_ROOT/sdk-dist/index.js"
          test -f "$GATEWAY_CLIENT_ROOT/sdk-dist/index.d.ts"
          ln -s "$GITHUB_WORKSPACE/packages/account-gateway/node_modules" "$GATEWAY_CLIENT_ROOT/sdk-dist/node_modules"
          ln -s "$GATEWAY_CLIENT_ROOT/sdk-dist" packages/account-gateway/dist
          pnpm --dir services/account-gateway run typecheck
          node --test services/account-gateway/test/fixtures/native-cli/joined-evidence.test.ts
          node --test services/account-gateway/test/fixtures/native-cli/execution-profile.test.ts
          git diff --exit-code -- pnpm-lock.yaml
      - name: Prepare exact Review Router source, real Action and its pinned Codex CLI
        run: |
          rr_source="$GATEWAY_CLIENT_ROOT/review-router-source"
          action_source="$GATEWAY_CLIENT_ROOT/review-action-source"
          rr_assets="$GATEWAY_CLIENT_ROOT/review-router-assets"
          mkdir -m 700 "$rr_assets" "$rr_assets/shim"
          git clone --no-checkout --filter=blob:none https://github.com/777genius/review-router-ai.git "$rr_source"
          git -C "$rr_source" checkout --detach "$REVIEW_ROUTER_COMMIT"
          test "$(git -C "$rr_source" rev-parse HEAD)" = "$REVIEW_ROUTER_COMMIT"
          git clone --no-checkout --filter=blob:none https://github.com/777genius/review-router.git "$action_source"
          git -C "$action_source" checkout --detach "$REVIEW_ACTION_COMMIT"
          git -C "$action_source" archive --format=tar "$REVIEW_ACTION_COMMIT" > "$rr_assets/action.tar"
          printf '%s  %s\n' 42e8d844bd451655ff171dc4093a872fc471675c90b3997697261ba4153807b4 "$rr_assets/action.tar" | sha256sum --check --strict
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 180 \
            https://github.com/openai/codex/releases/download/rust-v0.133.0/codex-npm-linux-x64-0.133.0.tgz \
            --output "$rr_assets/codex.tgz"
          printf '%s  %s\n' 298519feb7655b4bc0ffb17f15378d9e6365fb65c30f23ab00ab1e99eee3191d "$rr_assets/codex.tgz" | sha256sum --check --strict
          mkdir "$rr_assets/codex-runtime"
          tar -xzf "$rr_assets/codex.tgz" -C "$rr_assets/codex-runtime" --strip-components=3 package/vendor/x86_64-unknown-linux-musl
          printf '%s  %s\n' 524396258c974948334eabe6f2c6b1d8e1979dfd048d67d535ad9e4550fa5b26 "$rr_assets/codex-runtime/bin/codex" | sha256sum --check --strict
          printf '%s  %s\n' 90604f553d1fc200c6b23f53ef80a58f952e9b50e2716cb590f7e1bfa0f27b27 "$rr_assets/codex-runtime/codex-resources/bwrap" | sha256sum --check --strict
          test -x "$rr_assets/codex-runtime/codex-resources/bwrap"
          test -x "$rr_assets/codex-runtime/codex-path/rg"
          test -f "$rr_assets/codex-runtime/codex-package.json"
          test "$("$rr_assets/codex-runtime/bin/codex" --version)" = 'codex-cli 0.133.0'
          printf '#!/bin/sh\nexec "%s" "%s" pnpm "$@"\n' "$GATEWAY_CLIENT_RR_NODE" "$GATEWAY_CLIENT_COREPACK" > "$rr_assets/shim/pnpm"
          chmod 755 "$rr_assets/shim/pnpm"
          (
            cd "$rr_source"
            export PATH="$rr_assets/shim:$(dirname "$GATEWAY_CLIENT_RR_NODE"):$PATH"
            test "$(node --version)" = v24.21.0
            test "$(pnpm --version)" = 11.28.7
            node scripts/install-private-dependencies.mjs --ignore-scripts --frozen-lockfile
            pnpm rebuild @prisma/engines
            node scripts/prepare-pinned-subscription-runtime.ts
            REVIEW_ROUTER_REQUIRE_OFFLINE_PRISMA=1 node scripts/generate-prisma-offline.mjs
            git diff --exit-code -- package.json pnpm-lock.yaml
          )
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const root = process.env.GATEWAY_CLIENT_ROOT;
          const source = join(root, 'review-router-source');
          const lines = [
            'import { pathToFileURL } from "node:url";',
            'await import(pathToFileURL(' + JSON.stringify(join(source, 'node_modules/tsx/dist/loader.mjs')) + ').href);',
            'await import(pathToFileURL(' + JSON.stringify(join(source, 'scripts/review-investigation-paired-e2e/support/provider-subscriptions-joined.ts')) + ').href);',
          ];
          writeFileSync(join(root, 'review-router-assets', 'preload.mjs'), lines.join('\n') + '\n', { mode: 0o600 });
          NODE
      - name: Build isolated real-client and PostgreSQL lifecycle test binaries
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' \
            -o "$GATEWAY_CLIENT_ROOT/build/execution-probe" \
            "$GITHUB_WORKSPACE/services/account-gateway/test/fixtures/native-cli/execution-probe.go"
          cd "$GATEWAY_CLIENT_ROOT/native-source/backend"
          go test -tags unit,nativecli -c ./internal/gatewaytransport -o "$GATEWAY_CLIENT_ROOT/build/native-cli.test"
          go test -c ./internal/repository -o "$GATEWAY_CLIENT_ROOT/build/native-repository.test"
          CGO_ENABLED=0 go test -tags unit -c -ldflags='-s -w' ./internal/service -o "$GATEWAY_CLIENT_ROOT/build/native-account-info-service.test"
          CGO_ENABLED=0 go test -tags gatewaycustody -c -ldflags='-s -w' ./internal/repository -o "$GATEWAY_CLIENT_ROOT/build/native-account-info-repository.test"
          CGO_ENABLED=0 go test -tags unit -c -ldflags='-s -w' ./internal/gatewaybootstrap -o "$GATEWAY_CLIENT_ROOT/build/native-account-info-bootstrap.test"
          CGO_ENABLED=0 go test -tags unit -c -ldflags='-s -w' ./internal/handler/admin -o "$GATEWAY_CLIENT_ROOT/build/native-account-info-handler.test"
          git diff --exit-code -- go.mod go.sum
          cat > "$GATEWAY_CLIENT_ROOT/container/Dockerfile" <<'DOCKERFILE'
          ARG PG_IMAGE
          FROM ${PG_IMAGE}
          RUN . /etc/os-release && test "$VERSION_CODENAME" = trixie \
            && apt-get update \
            && DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends --no-upgrade \
              libatomic1=14.2.0-19 ca-certificates=20250419+deb13u1 git=1:2.47.3-0+deb13u1 \
            && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
          docker build --pull --build-arg "PG_IMAGE=$PG_IMAGE" --tag gateway-native-clients:qualified "$GATEWAY_CLIENT_ROOT/container"
      - name: Native metadata and provider boundary unit qualification
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { goTestEvidence } from './services/account-gateway/test/fixtures/native-cli/evidence.ts';
          const suites = [
            ['service', '^Test(Gateway(AccountInfo|AccountModelsReadFencesAndRedaction|GLMAccountModelsCatalog|NVIDIAAccountModelsPhysicalRouteAndFences|OpenRouterModelsSourcePolicyAndCache|QuotaAndInfo|Codex(Info|RetainedInfo|Maintenance)|ClaudeInfo|GrokInfo|OAuthInfo|AccountCapabilities|GeminiContinuation|NativeGemini|NativeOfficial|NativeAnthropicSchema|NativeOAuthImport|NVIDIABuildChatUpstreamStatusDiagnostic)|ForwardResponses_(ForceChatCompletionsRoutes|ChatFallback)|ForwardResponsesChatCompletionsFallbackKeepsFunctionArgumentsSingle)', [
              'TestGatewayAccountInfoReaderUsesCurrentSnapshotAndFinalAuthority',
              'TestGatewayAccountModelsReadFencesAndRedaction',
              'TestGatewayGLMAccountModelsCatalog',
              'TestGatewayNVIDIAAccountModelsPhysicalRouteAndFences',
              'TestGatewayOpenRouterModelsSourcePolicyAndCache',
              'TestGatewayCodexMaintenanceHydratesOnceWithoutProviderHTTP',
              'TestGatewayNativeOfficialAnthropicOriginalSchemaBeforeSuccess',
              'TestGatewayNativeOfficialGeminiActualTLSContinuationAndSchema',
              'TestGatewayNativeOAuthImportStrictEscapedIngressAndSeparateCodec',
              'TestForwardResponses_ForceChatCompletionsRoutesNonStreamingToChatCompletions',
              'TestForwardResponses_ForceChatCompletionsRoutesStreamingToChatCompletions',
              'TestForwardResponses_ChatFallbackRejectsInvalidToolArgumentsAtOutputLimit',
              'TestForwardResponses_ChatFallbackCachesStreamedReasoning',
              'TestForwardResponses_ChatFallbackRestoresReasoningFromCache',
              'TestForwardResponsesChatCompletionsFallbackKeepsFunctionArgumentsSingle',
              'TestGatewayNVIDIABuildChatUpstreamStatusDiagnostic',
            ]],
            ['bootstrap', '^Test(NativeAccountCapabilities|NativeOfficialAPIConfig|GatewayAccountLimitsAuthorityHTTP)', [
              'TestNativeAccountCapabilitiesExposeImportsOnlyWithComposedCodex',
              'TestNativeOfficialAPIConfigUsesExistingClosedFD6Profiles',
              'TestGatewayAccountLimitsAuthorityHTTP',
            ]],
            ['handler', '^TestGateway(AccountInfoPrivateHTTPContract|NativeOAuthConnectHTTPImportStrictIngress)', [
              'TestGatewayAccountInfoPrivateHTTPContract',
              'TestGatewayNativeOAuthConnectHTTPImportStrictIngress',
            ]],
          ];
          for (const [suite, pattern, required] of suites) {
            const binary = join(process.env.GATEWAY_CLIENT_ROOT, 'build', 'native-account-info-' + suite + '.test');
            const options = { encoding: 'utf8', timeout: 120000, maxBuffer: 2 * 1024 * 1024 };
            const listed = spawnSync(binary, ['-test.list', pattern], options);
            assert.equal(listed.status, 0, suite + ' test listing');
            const names = listed.stdout.split(/\r?\n/).filter(name => /^Test[A-Za-z0-9_]{1,160}$/.test(name));
            assert.ok(required.every(name => names.includes(name)), suite + ' required tests must exist');
            const executed = spawnSync(binary, ['-test.run', pattern, '-test.v', '-test.count=1', '-test.timeout=110s'], options);
            const evidence = goTestEvidence(executed.stdout ?? '', names);
            writeFileSync(join(process.env.GATEWAY_CLIENT_ROOT, 'build', 'native-' + suite + '-unit.json'), JSON.stringify(evidence) + '\n');
            console.log(JSON.stringify({ suite, ...evidence }));
            assert.equal(executed.status, 0, suite + ' unit execution');
            assert.equal(evidence.tests.length, names.length, suite + ' no missing test results');
            assert.ok(names.every(name => evidence.tests.some(test => test.name === name && test.outcome === 'PASS')), suite + ' every selected test must pass without skip');
          }
          NODE
      - name: Build source-pinned fixtures for real clients through TypeScript authority
        run: |
          node services/account-gateway/test/fixtures/native-cli/build-joined.ts \
            --repo "$GITHUB_WORKSPACE" --native-source "$GATEWAY_CLIENT_ROOT/native-source" \
            --output "$GATEWAY_CLIENT_ROOT/build/joined" --go "$GATEWAY_CLIENT_GO" \
            --native-commit "$NATIVE_COMMIT" --gateway-commit "$(git rev-parse HEAD)"
      - name: Race-check the actual public ingress and bounded bootstrap
        run: |
          node --test services/account-gateway/test/fixtures/native-cli/evidence.test.ts
          node services/account-gateway/test/fixtures/native-cli/race.ts \
            "$GATEWAY_CLIENT_ROOT/native-source/backend" "$GATEWAY_CLIENT_ROOT/build"
      - name: Real Codex and Claude Code through Go, OAuth and PostgreSQL without egress
        run: |
          docker run --rm --network none --user 0:0 --cpus 2 --memory 4g --pids-limit 256 --ulimit nofile=4096:4096 \
            --mount "type=bind,source=$GATEWAY_CLIENT_NODE_HOME,target=$GATEWAY_CLIENT_NODE_HOME,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=$GITHUB_WORKSPACE,readonly" \
            --mount "type=bind,source=$GATEWAY_CLIENT_ROOT,target=$GATEWAY_CLIENT_ROOT,readonly" \
            --mount "type=bind,source=$GATEWAY_CLIENT_ROOT/artifacts,target=$GATEWAY_CLIENT_ROOT/artifacts" \
            --entrypoint "$GATEWAY_CLIENT_NODE" gateway-native-clients:qualified \
            "$GITHUB_WORKSPACE/services/account-gateway/test/fixtures/native-cli/run.ts" \
            --pg-bin /usr/lib/postgresql/17/bin \
            --test-binary "$GATEWAY_CLIENT_ROOT/build/native-cli.test" \
            --repository-test-binary "$GATEWAY_CLIENT_ROOT/build/native-repository.test" \
            --account-info-test-binary "$GATEWAY_CLIENT_ROOT/build/native-account-info-repository.test" \
            --clients "$GATEWAY_CLIENT_ROOT/clients/clients.json" \
            --artifacts "$GATEWAY_CLIENT_ROOT/artifacts/native-clients" \
            --native-commit "$NATIVE_COMMIT" --gateway-commit "$(git rev-parse HEAD)"
      - name: Join real clients and six Review Router providers to TypeScript authority
        run: |
          node services/account-gateway/test/fixtures/native-cli/run-profile.ts
      - name: Expose bounded synthetic qualification evidence
        if: ${{ always() && env.GATEWAY_CLIENT_ROOT != '' }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$GATEWAY_CLIENT_ROOT/artifacts"
          node --input-type=module -e '
            import { readFileSync, existsSync } from "node:fs";
            import { join } from "node:path";
            const root = join(process.env.GATEWAY_CLIENT_ROOT, "artifacts", "native-clients");
            for (const file of ["result.json", "test.log", "repository-test.log", "account-info-test.log"]) {
              if (existsSync(join(root, file))) process.stdout.write(file + "\n" + readFileSync(join(root, file), "utf8") + "\n");
            }
            const joined = join(process.env.GATEWAY_CLIENT_ROOT, "artifacts", "joined-clients", "result.json");
            if (existsSync(joined)) process.stdout.write("joined-clients\n" + readFileSync(joined, "utf8") + "\n");
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && env.GATEWAY_CLIENT_ROOT != '' }}
        with:
          name: native-clients-${{ matrix.node }}
          path: |
            ${{ env.GATEWAY_CLIENT_ROOT }}/artifacts/native-clients/result.json
            ${{ env.GATEWAY_CLIENT_ROOT }}/artifacts/native-clients/network.json
            ${{ env.GATEWAY_CLIENT_ROOT }}/artifacts/native-clients/test.log
            ${{ env.GATEWAY_CLIENT_ROOT }}/artifacts/native-clients/repository-test.log
            ${{ env.GATEWAY_CLIENT_ROOT }}/artifacts/native-clients/account-info-test.log
            ${{ env.GATEWAY_CLIENT_ROOT }}/build/public-race.json
            ${{ env.GATEWAY_CLIENT_ROOT }}/build/reservation-race.json
            ${{ env.GATEWAY_CLIENT_ROOT }}/build/bootstrap-race.json
            ${{ env.GATEWAY_CLIENT_ROOT }}/build/upstream-race.json
            ${{ env.GATEWAY_CLIENT_ROOT }}/build/diagnostics-race.json
            ${{ env.GATEWAY_CLIENT_ROOT }}/build/joined/joined-build.json
            ${{ env.GATEWAY_CLIENT_ROOT }}/build/native-service-unit.json
            ${{ env.GATEWAY_CLIENT_ROOT }}/build/native-bootstrap-unit.json
            ${{ env.GATEWAY_CLIENT_ROOT }}/build/native-handler-unit.json
            ${{ env.GATEWAY_CLIENT_ROOT }}/artifacts/joined-clients/result.json
            ${{ env.GATEWAY_CLIENT_ROOT }}/artifacts/joined-clients/network.json
            ${{ env.GATEWAY_CLIENT_ROOT }}/artifacts/execution-host.json
            ${{ env.GATEWAY_CLIENT_ROOT }}/artifacts/execution-preflight.json
            ${{ env.GATEWAY_CLIENT_ROOT }}/build/execution.apparmor
            ${{ env.GATEWAY_CLIENT_ROOT }}/build/execution.apparmor.bin
            ${{ env.GATEWAY_CLIENT_ROOT }}/build/execution-seccomp.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ matrix.node == '26.11.1' && always() && env.GATEWAY_CLIENT_ROOT != '' }}
        with:
          name: native-account-feature-fixtures
          path: |
            ${{ env.GATEWAY_CLIENT_ROOT }}/build/native-account-info-service.test
            ${{ env.GATEWAY_CLIENT_ROOT }}/build/native-account-info-repository.test
            ${{ env.GATEWAY_CLIENT_ROOT }}/build/native-account-info-bootstrap.test
            ${{ env.GATEWAY_CLIENT_ROOT }}/build/native-account-info-handler.test
            ${{ env.GATEWAY_CLIENT_ROOT }}/build/joined/native-provider-joined/fixture
            ${{ env.GATEWAY_CLIENT_ROOT }}/build/joined/native-device-joined/fixture
            ${{ env.GATEWAY_CLIENT_ROOT }}/build/joined/native-claude-joined/fixture
            ${{ env.GATEWAY_CLIENT_ROOT }}/build/joined/joined-build.json
          if-no-files-found: error
          retention-days: 3
  native_client_gate:
    needs: native_clients
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require both client qualification lanes
        env:
          LANE_RESULT: ${{ needs.native_clients.result }}
        run: test "$LANE_RESULT" = success

