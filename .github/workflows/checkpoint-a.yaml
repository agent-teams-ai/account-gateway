name: Checkpoint A package qualification
on:
  pull_request:
  workflow_dispatch:
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - run: npm install --prefix "$RUNNER_TEMP/gateway-pnpm" --ignore-scripts pnpm@11.28.2
      - run: node "$RUNNER_TEMP/gateway-pnpm/node_modules/pnpm/bin/pnpm.cjs" install --frozen-lockfile
      - run: node "$RUNNER_TEMP/gateway-pnpm/node_modules/pnpm/bin/pnpm.cjs" run build
      - run: node "$RUNNER_TEMP/gateway-pnpm/node_modules/pnpm/bin/pnpm.cjs" test
      - run: node scripts/check-topology.mjs
      - run: node node_modules/@agent-teams/engineering-foundation/dist/cli.js check architecture.source-dependencies --consumer .
      - run: node node_modules/@agent-teams/engineering-foundation/dist/cli.js assert-dev-only --consumer . --json
      - run: node node_modules/@agent-teams/docs-protocol/dist/cli.js check --consumer . --profile docs.config.yaml
      - run: node "$RUNNER_TEMP/gateway-pnpm/node_modules/pnpm/bin/pnpm.cjs" --dir packages/account-gateway pack --pack-destination "$RUNNER_TEMP/gateway-archive"
      - run: scripts/qualify-consumers.sh "$RUNNER_TEMP/gateway-archive/agent-teams-account-gateway-0.1.0.tgz" "$RUNNER_TEMP/gateway-consumers"
